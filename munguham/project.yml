# xcodegen 설정. `xcodegen generate` 로 Munguham.xcodeproj 를 만든다.
# 앱(문구함) + 키보드(문구함 키보드). 둘은 App Group 폴더의 같은 문구 파일을 읽는다.
name: Munguham
options:
  bundleIdPrefix: app.munguham
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: XCLCW4FA75   # 무료 팀 (양면·포봄노트와 같다)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Munguham:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.app.munguham]
    dependencies:
      - target: MunguKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.munguham.app
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MunguKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.app.munguham]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.munguham.app.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        APPLICATION_EXTENSION_API_ONLY: YES
