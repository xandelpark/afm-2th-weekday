# xcodegen 설정. `xcodegen generate` 로 PobomNote.xcodeproj 를 만든다.
name: PobomNote
options:
  bundleIdPrefix: app.pobom
  deploymentTarget:
    iOS: "17.0"   # 크레파스 잉크(PencilKit)가 17 부터
  xcodeVersion: "27.0"
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: XCLCW4FA75   # Xcode 에 넣은 Apple ID 의 무료 팀 (양면과 같다)
targets:
  PobomNote:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pobom.note
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # 도장 잉크 결을 픽셀 단위로 계산한다. 폰에 올리는 Debug 빌드도 최적화해야 찍을 때 안 끊긴다.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
